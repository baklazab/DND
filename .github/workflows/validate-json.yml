name: Validate D&D rules JSON

on:
  push:
    paths: ["data/rules/**", "etl/**", ".github/workflows/validate-json.yml"]
  pull_request:
    paths: ["data/rules/**", "etl/**", ".github/workflows/validate-json.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2.6.0"
      - run: python etl/validate.py
